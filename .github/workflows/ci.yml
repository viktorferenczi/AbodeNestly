name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# TESTING §9 gates: the TypeScript workspace (`ts`) and the Supabase pgTAP suite (`db`).
# `ios` runs unit + component tests; XCUITest e2e needs `supabase start` and runs locally/nightly like web e2e.
# `android` runs lint, unit and Compose component tests; the instrumented e2e needs `supabase start` and a device, so it runs locally/nightly.
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm -r lint
      - name: typecheck
        run: pnpm -r typecheck
      - name: unit
        run: pnpm -r test
      - name: contract
        run: |
          pnpm --filter @abodenestly/contract openapi
          pnpm --filter @abodenestly/contract swift
          pnpm --filter @abodenestly/contract kotlin
          git diff --exit-code docs/openapi.yaml apps/ios/Packages/Contract apps/android/contract
  # API integration tests hit a real local Supabase (auth + rest + db only; the rest is excluded to start faster).
  api-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: start Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,storage-api,realtime,inbucket,edge-runtime,vector,logflare,postgres-meta,mailpit
      - name: export test env
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: api integration
        run: pnpm --filter @abodenestly/api test:int
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: start database (applies migrations)
        run: supabase db start
      - name: pgTAP
        run: supabase test db
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Xcode 26.x aborts syncing the package graph when a local package named "UI" sits beside supabase-swift (hence Packages/NestlyUI). Keep off 26.6 anyway.
      - name: select Xcode (not 26.6)
        run: |
          ls -d /Applications/Xcode_*.app
          x=$(ls -d /Applications/Xcode_*.app | grep -v 'Xcode_26\.6' | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: pick an iPhone simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(sorted(x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone'))[-1])")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # Unit (Core, Shared) and component tests run in the hosted AbodeNestlyTests target.
      - name: unit and component tests
        working-directory: apps/ios
        run: >
          xcodebuild test -project AbodeNestly.xcodeproj -scheme "AbodeNestly Dev"
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          -skip-testing:AbodeNestlyUITests
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: module graph, lint, unit and component tests
        working-directory: apps/android
        run: ./gradlew checkModuleGraph lintDevDebug testDevDebugUnitTest
