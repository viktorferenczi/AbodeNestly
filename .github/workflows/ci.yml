name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# TESTING §9 gates: the TypeScript workspace (`ts`), the Supabase pgTAP suite (`db`) and the
# API integration tests against a local Supabase stack (`api-int`).
# Native builds are added by the stories that first need them.
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm -r lint
      - name: typecheck
        run: pnpm -r typecheck
      - name: unit
        run: pnpm -r test
      - name: contract
        run: |
          pnpm --filter @abodenestly/contract openapi
          git diff --exit-code docs/openapi.yaml
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: start database (applies migrations)
        run: supabase db start
      - name: pgTAP
        run: supabase test db
  api-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: start Supabase (applies migrations)
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - name: export service-role key
        run: echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - name: api integration
        run: pnpm --filter @abodenestly/api test:int
