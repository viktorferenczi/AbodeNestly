name: xcode-probe
on: pull_request
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["UI","Shared","Contract","Shopping","Pantry","Maintenance"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - run: |
          f=apps/ios/Packages/Core/Package.swift
          sed -i '' '/\.package(path:/d; s/"Contract", "Shared", "UI",//' $f
          cat $f
          others=""
          for n in UI Shared Contract Shopping Pantry Maintenance; do [ "$n" != "${{ matrix.mode }}" ] && others="$others $n"; done
          python3 .github/probe_strip.py GRDB.swift ViewInspector $others
      - working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project AbodeNestly.xcodeproj -scheme "AbodeNestly Dev"
