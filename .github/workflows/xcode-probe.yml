name: xcode-probe
on: pull_request
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        strip: ["Core UI Shared Contract GRDB.swift ViewInspector", "Shopping Pantry Maintenance GRDB.swift ViewInspector", "Core UI Shared Contract Shopping Pantry Maintenance", "Shopping Pantry Maintenance Core UI Shared Contract GRDB.swift ViewInspector"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - run: python3 .github/probe_strip.py ${{ matrix.strip }}
      - working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project AbodeNestly.xcodeproj -scheme "AbodeNestly Dev"
