name: xcode-probe
on: pull_request
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["nolocals", "nolocals-nogrdb-novi", "nolocals-nostubs"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - run: |
          f=apps/ios/Packages/Core/Package.swift
          sed -i '' '/\.package(path:/d; s/"Contract", "Shared", "UI",//' $f
          cat $f
          case "${{ matrix.mode }}" in
            nolocals-nogrdb-novi) python3 .github/probe_strip.py GRDB.swift ViewInspector ;;
            nolocals-nostubs) python3 .github/probe_strip.py GRDB.swift ViewInspector Shopping Pantry Maintenance UI Shared Contract ;;
          esac
      - working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project AbodeNestly.xcodeproj -scheme "AbodeNestly Dev"
