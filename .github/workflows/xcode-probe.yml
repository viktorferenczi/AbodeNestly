name: xcode-probe
on: pull_request
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        strip: ["GRDB.swift", "ViewInspector", "UI Shared Contract", "Shopping Pantry Maintenance", "GRDB.swift Shopping Pantry Maintenance"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - run: python3 .github/probe_strip.py ${{ matrix.strip }}
      - working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project AbodeNestly.xcodeproj -scheme "AbodeNestly Dev"
