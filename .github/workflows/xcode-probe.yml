name: xcode-probe
on: pull_request
jobs:
  probe:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.0.1", "26.1.1", "26.2", "26.3", "26.4.1"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app && xcodebuild -version
      - working-directory: apps/ios
        run: xcodebuild -resolvePackageDependencies -project AbodeNestly.xcodeproj -scheme "AbodeNestly Dev"
